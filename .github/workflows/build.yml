name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin \
            m4 pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install "Cython<3" buildozer

      - name: Build debug APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: martes-apk
          path: bin/*.apk
