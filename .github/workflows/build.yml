name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Esta acción corre Buildozer dentro de un contenedor ya preparado,
      # así no hay que instalar el SDK, el NDK ni las librerías a mano.
      - name: Build debug APK
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: martes-apk
          path: ${{ steps.buildozer.outputs.filename }}
